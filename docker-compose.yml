services:
  web:
    build:
      context: ./api
    container_name: think_ps_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./api:/app
    ports:
      - "8000:8000"
    environment:
      - MONGO_HOST=mongo
      - MONGO_PORT=27017
      - MONGO_DB=think_ps
    depends_on:
      - mongo

  ui:
    build:
      context: ./ui
    container_name: think_ps_ui
    command: npm run dev
    volumes:
      - ./ui:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    environment:
      - DJANGO_API_URL=http://web:8000
    depends_on:
      - web

  mongo:
    image: mongo:7
    container_name: think_ps_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
